<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia de Cata</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Cline x1='16' y1='2' x2='16' y2='6'%3E%3C/line%3E%3Cline x1='8' y1='2' x2='8' y2='6'%3E%3C/line%3E%3Cline x1='3' y1='10' x2='21' y2='10'%3E%3C/line%3E%3C/svg%3E">
    <meta name="theme-color" content="#8b5cf6">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container glass">
        <button id="themeToggle" aria-label="Cambiar tema" class="glass icon-btn">
            <svg id="themeIcon" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
        </button>

        <header>
            <h1>Cata <span>Asistencia</span></h1>
        </header>

        <main>
            <section class="card-input glass">
                <h3><i class="fa-solid fa-calendar-plus"></i> Registrar Nueva Ausencia</h3>
                <div class="input-group">
                    <input type="date" id="fechaInput">
                    <input type="text" id="motivoInput" placeholder="Motivo o Justificación (ej: Turno médico)">
                    <button id="btnAnotar" class="btn-primary">
                        <i class="fa-solid fa-check"></i> Anotar
                    </button>
                </div>
            </section>

            <section class="filters-container glass">
                <div class="filters-group">
                    <select id="filtroMes">
                        <option value="todos">Todos los meses</option>
                        <option value="01">Enero</option><option value="02">Febrero</option>
                        <option value="03">Marzo</option><option value="04">Abril</option>
                        <option value="05">Mayo</option><option value="06">Junio</option>
                        <option value="07">Julio</option><option value="08">Agosto</option>
                        <option value="09">Septiembre</option><option value="10">Octubre</option>
                        <option value="11">Noviembre</option><option value="12">Diciembre</option>
                    </select>
                    <select id="filtroAnio">
                        <option value="todos">Todos los años</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
                <button id="btnExportar" class="btn-secondary">
                    <i class="fa-solid fa-file-pdf"></i> Exportar Reporte PDF
                </button>
            </section>

            <div class="stats glass">
                <span class="stat-label">Días ausente</span>
                <span id="totalFaltas" class="stat-number">0</span>
            </div>

            <ul id="listaFaltas" class="faltas-list"></ul>

            <ul id="skeletonList" class="faltas-list">
                <li class="skeleton"><div class="skeleton-text"></div><div class="skeleton-btn"></div></li>
                <li class="skeleton"><div class="skeleton-text"></div><div class="skeleton-btn"></div></li>
                <li class="skeleton"><div class="skeleton-text"></div><div class="skeleton-btn"></div></li>
            </ul>

            <div id="emptyState" class="empty-state hidden">
                <i class="fa-solid fa-calendar-check"></i>
                <p>No hay faltas registradas en este período.</p>
            </div>
        </main>

        <footer class="footer-credencial">
            <span class="titulo-profesional">Técnica en Acompañamiento Terapéutico</span>
            <span class="nombre-profesional">Nadia Luján Sosa</span>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <script type="module" src="app.js"></script>
</body>
<div id="loadingBar" class="loading-bar"></div>
</html>
