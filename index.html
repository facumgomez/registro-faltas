<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia de Cata</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Cline x1='16' y1='2' x2='16' y2='6'%3E%3C/line%3E%3Cline x1='8' y1='2' x2='8' y2='6'%3E%3C/line%3E%3Cline x1='3' y1='10' x2='21' y2='10'%3E%3C/line%3E%3C/svg%3E">

<body>

    <div class="container">

        <button id="themeToggle" aria-label="Cambiar tema">
            <svg id="themeIcon" viewBox="0 0 24 24">
                <path
                    d="M21 12.79A9 9 0 1111.21 3
                    7 7 0 0021 12.79z"
                />
            </svg>
        </button>

        <h1>Faltas de Cata</h1>

        <div class="input-group">
            <input type="date" id="fechaInput">
            <button id="btnAnotar">Anotar</button>
        </div>

        <div class="stats">
            Días ausente: <span id="totalFaltas">0</span>
        </div>

        <ul id="listaFaltas"></ul>

        <div class="footer-credencial">
            <span class="titulo-profesional">Técnica en Acompañamiento Terapéutico</span>
            <span class="nombre-profesional">Nadia Luján Sosa</span>
        </div>

    </div>

    <script type="module" src="app.js"></script>

</html>
