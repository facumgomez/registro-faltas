<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia de Cata</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Cline x1='16' y1='2' x2='16' y2='6'%3E%3C/line%3E%3Cline x1='8' y1='2' x2='8' y2='6'%3E%3C/line%3E%3Cline x1='3' y1='10' x2='21' y2='10'%3E%3C/line%3E%3C/svg%3E">
    <meta name="theme-color" content="#8b5cf6">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">

        <button id="themeToggle" aria-label="Cambiar tema">
            <svg id="themeIcon" viewBox="0 0 24 24">
                <path
                    d="M21 12.79A9 9 0 1111.21 3
                    7 7 0 0021 12.79z"
                />
            </svg>
        </button>

        <h1>Faltas de Cata</h1>

        <div class="input-group">
            <input type="date" id="fechaInput">
            <button id="btnAnotar">Anotar</button>
        </div>

        <div class="filtros-container">
            <div class="filtros-group">
                <select id="filtroMes">
                    <option value="todos">Todos los meses</option>
                    <option value="01">Enero</option>
                    <option value="02">Febrero</option>
                    <option value="03">Marzo</option>
                    <option value="04">Abril</option>
                    <option value="05">Mayo</option>
                    <option value="06">Junio</option>
                    <option value="07">Julio</option>
                    <option value="08">Agosto</option>
                    <option value="09">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
                
                <select id="filtroAnio">
                    <option value="todos">Todos los años</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>
            </div>
            
            <button id="btnExportar" class="btn-exportar">
                <i class="fa-solid fa-file-excel"></i> Exportar
            </button>
        </div>
        <div class="stats">
            Días ausente: <span id="totalFaltas">0</span>
        </div>

        <ul id="listaFaltas"></ul>

        <div id="emptyState" class="empty-state hidden" style="text-align: center; margin-top: 20px; color: #64748b;">
            <i class="fa-solid fa-calendar-check" style="font-size: 2rem; margin-bottom: 10px; opacity: 0.5;"></i>
            <p>No hay faltas en este período</p>
        </div>

        <div class="footer-credencial">
            <span class="titulo-profesional">Técnica en Acompañamiento Terapéutico</span>
            <span class="nombre-profesional">Nadia Luján Sosa</span>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
